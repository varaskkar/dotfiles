# --- Interfaz e Integracion ---
#save-position-on-quit
#keep-open=yes
player-operation-mode=pseudo-gui
autofit-large=70%x70%
autofit=50%

# --- Rendimiento y Audio ---
profile=gpu-hq
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe
audio-file-auto=exact
input-ipc-server=/tmp/mpvsocket
ao=pipewire

# --- Sincronizacion y Fluidez (Smooth Motion) ---
video-sync=display-resample
interpolation=yes
tscale=oversample

# --- Subtitulos Inteligentes ---
sub-auto=fuzzy
alang=es,en
slang=es,en
sub-font='sans-serif'
sub-font-size=40
sub-border-size=2
sub-shadow-1
sid=no
sub-visibility=yes
